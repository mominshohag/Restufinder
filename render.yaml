services:
  - type: web
    name: restufinder-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      # Optional — add these in the Render dashboard for richer data:
      # GOOGLE_PLACES_API_KEY
      # FACEBOOK_APP_ID
      # FACEBOOK_APP_SECRET
